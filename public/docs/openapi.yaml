                    example: 1
                  email:
                    type: string
                    example: admin@example.com
                  first_name:
                    type: string
                    example: Test
                  last_name:
                    type: string
                    example: Admin
                  phone:
                    type: string
                    example: +1.646.261.0356
                  email_verified_at:
