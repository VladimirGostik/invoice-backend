                example:
                  id: 1
                  email: admin@example.com
                  first_name: Test
                  last_name: Admin
                  phone: +1.646.261.0356
                  email_verified_at: '2023-09-21T10 =>27 =>09.000000Z'
                  state: ACTIVE
                  created_at: '2023-09-21T10 =>27 =>09.000000Z'
                  updated_at: '2023-09-21T10 =>27 =>09.000000Z'
