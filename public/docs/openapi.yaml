components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/auth/login:
    post:
      summary: Login
      operationId: login
      description: 'Get a JWT via given credentials.'
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjgwMDAvYXBpL2F1dGgvbG9naW4iLCJpYXQiOjE2OTU3MTIwNTEsImV4cCI6MTY5NTcxNTY1MSwibmJmIjoxNjk1NzEyMDUxLCJqdGkiOiJJeWVpVmFHSWoyZFZyRG5YIiwic3ViIjoiMSIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjciLCJlbnRpdHlfaWQiOm51bGx9.f-mRC92U2zhjPI1pUCFRfFYnwQI3jgyLMCnznIHoxk4
                  token_type: bearer
                  expires_in: '3600'
                properties:
                  access_token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjgwMDAvYXBpL2F1dGgvbG9naW4iLCJpYXQiOjE2OTU3MTIwNTEsImV4cCI6MTY5NTcxNTY1MSwibmJmIjoxNjk1NzEyMDUxLCJqdGkiOiJJeWVpVmFHSWoyZFZyRG5YIiwic3ViIjoiMSIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjciLCJlbnRpdHlfaWQiOm51bGx9.f-mRC92U2zhjPI1pUCFRfFYnwQI3jgyLMCnznIHoxk4
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: string
                    example: '3600'
        401:
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                example:
                  message: messages.unauthorized_access
                properties:
                  message:
                    type: string
                    example: messages.unauthorized_access
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email of the user.'
                  example: admin@example.com
                  nullable: false
                password:
                  type: string
                  description: 'The password of the user.'
                  example: password
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/auth/forgot-password:
    post:
      summary: 'Forgot password'
      operationId: forgotPassword
      description: "Send a password reset link to user's email"
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 'Status message'
                properties:
                  status:
                    type: string
                    example: 'Status message'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email of the user.'
                  example: admin@example.com
                  nullable: false
              required:
                - email
      security: []
  /api/auth/reset-password:
    post:
      summary: 'Reset password'
      operationId: resetPassword
      description: "Reset user's password"
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 'Status message'
                properties:
                  status:
                    type: string
                    example: 'Status message'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The password reset token.'
                  example: dd37ed6ef02e80ea8ced619f8bfbd5604568404a58b77cc0572575ccf0c8a159
                  nullable: false
                email:
                  type: string
                  description: 'The email of the user.'
                  example: qkunze@example.com
                  nullable: false
                password:
                  type: string
                  description: 'The new password.'
                  example: 'e@#L_EW>Vn'
                  nullable: false
                password_confirmation:
                  type: string
                  description: 'Confirm the new password.'
                  example: 'e@#L_EW>Vn'
                  nullable: false
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
