openapi: 3.0.3
info:
  title: 'Invoice Backend API API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: ''
  -
    name: Firmy
    description: ''
  -
    name: 'Jednorazové faktúry'
    description: ''
  -
    name: 'Mesačné faktúry'
    description: ''
  -
    name: Role
    description: ''
  -
    name: Ulice
    description: ''
  -
    name: 'Zoznam používateľov'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/auth/login:
    post:
      summary: Login
      operationId: login
      description: 'Get a JWT via given credentials.'
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjgwMDAvYXBpL2F1dGgvbG9naW4iLCJpYXQiOjE2OTU3MTIwNTEsImV4cCI6MTY5NTcxNTY1MSwibmJmIjoxNjk1NzEyMDUxLCJqdGkiOiJJeWVpVmFHSWoyZFZyRG5YIiwic3ViIjoiMSIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjciLCJlbnRpdHlfaWQiOm51bGx9.f-mRC92U2zhjPI1pUCFRfFYnwQI3jgyLMCnznIHoxk4
                  token_type: bearer
                  expires_in: '3600'
                properties:
                  access_token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjgwMDAvYXBpL2F1dGgvbG9naW4iLCJpYXQiOjE2OTU3MTIwNTEsImV4cCI6MTY5NTcxNTY1MSwibmJmIjoxNjk1NzEyMDUxLCJqdGkiOiJJeWVpVmFHSWoyZFZyRG5YIiwic3ViIjoiMSIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjciLCJlbnRpdHlfaWQiOm51bGx9.f-mRC92U2zhjPI1pUCFRfFYnwQI3jgyLMCnznIHoxk4
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: string
                    example: '3600'
        401:
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                example:
                  message: messages.unauthorized_access
                properties:
                  message:
                    type: string
                    example: messages.unauthorized_access
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email of the user.'
                  example: admin@example.com
                  nullable: false
                password:
                  type: string
                  description: 'The password of the user.'
                  example: password
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/auth/forgot-password:
    post:
      summary: 'Forgot password'
      operationId: forgotPassword
      description: "Send a password reset link to user's email"
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 'Status message'
                properties:
                  status:
                    type: string
                    example: 'Status message'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email of the user.'
                  example: admin@example.com
                  nullable: false
              required:
                - email
      security: []
  /api/auth/reset-password:
    post:
      summary: 'Reset password'
      operationId: resetPassword
      description: "Reset user's password"
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 'Status message'
                properties:
                  status:
                    type: string
                    example: 'Status message'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The password reset token.'
                  example: dd37ed6ef02e80ea8ced619f8bfbd5604568404a58b77cc0572575ccf0c8a159
                  nullable: false
                email:
                  type: string
                  description: 'The email of the user.'
                  example: qkunze@example.com
                  nullable: false
                password:
                  type: string
                  description: 'The new password.'
                  example: 'e@#L_EW>Vn'
                  nullable: false
                password_confirmation:
                  type: string
                  description: 'Confirm the new password.'
                  example: 'e@#L_EW>Vn'
                  nullable: false
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  /api/auth/refresh:
    post:
      summary: 'Refresh token'
      operationId: refreshToken
      description: 'Refresh a token.'
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjgwMDAvYXBpL2F1dGgvbG9naW4iLCJpYXQiOjE2OTU3MTIwNTEsImV4cCI6MTY5NTcxNTY1MSwibmJmIjoxNjk1NzEyMDUxLCJqdGkiOiJJeWVpVmFHSWoyZFZyRG5YIiwic3ViIjoiMSIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjciLCJlbnRpdHlfaWQiOm51bGx9.f-mRC92U2zhjPI1pUCFRfFYnwQI3jgyLMCnznIHoxk4
                  token_type: bearer
                  expires_in: '3600'
                properties:
                  access_token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjgwMDAvYXBpL2F1dGgvbG9naW4iLCJpYXQiOjE2OTU3MTIwNTEsImV4cCI6MTY5NTcxNTY1MSwibmJmIjoxNjk1NzEyMDUxLCJqdGkiOiJJeWVpVmFHSWoyZFZyRG5YIiwic3ViIjoiMSIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjciLCJlbnRpdHlfaWQiOm51bGx9.f-mRC92U2zhjPI1pUCFRfFYnwQI3jgyLMCnznIHoxk4
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: string
                    example: '3600'
      tags:
        - Authentication
  /api/auth/user:
    get:
      summary: 'Get user'
      operationId: getUser
      description: 'Get the authenticated User.'
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  email: admin@example.com
                  first_name: Test
                  last_name: Admin
                  phone: +1.646.261.0356
                  email_verified_at: '2023-09-21T10 =>27 =>09.000000Z'
                  state: ACTIVE
                  created_at: '2023-09-21T10 =>27 =>09.000000Z'
                  updated_at: '2023-09-21T10 =>27 =>09.000000Z'
                properties:
                  id:
                    type: integer
                    example: 1
                  email:
                    type: string
                    example: admin@example.com
                  first_name:
                    type: string
                    example: Test
                  last_name:
                    type: string
                    example: Admin
                  phone:
                    type: string
                    example: +1.646.261.0356
                  email_verified_at:
                    type: string
                    example: '2023-09-21T10 =>27 =>09.000000Z'
                  state:
                    type: string
                    example: ACTIVE
                  created_at:
                    type: string
                    example: '2023-09-21T10 =>27 =>09.000000Z'
                  updated_at:
                    type: string
                    example: '2023-09-21T10 =>27 =>09.000000Z'
      tags:
        - Authentication
  /api/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Log the user out (Invalidate the token).'
      parameters: []
      responses: {  }
      tags:
        - Authentication
  /api/companies/main:
    get:
      summary: 'Zoznam všetkých firiem.'
      operationId: zoznamVetkchFiriem
      description: ''
      parameters:
        -
          in: query
          name: page
          description: 'Set the page number for pagination. Default: 1'
          example: 1
          required: true
          schema:
            type: integer
            description: 'Set the page number for pagination. Default: 1'
            example: 1
            nullable: false
        -
          in: query
          name: per_page
          description: 'Set the number of records per page. Default: 10'
          example: 10
          required: true
          schema:
            type: integer
            description: 'Set the number of records per page. Default: 10'
            example: 10
            nullable: false
        -
          in: query
          name: 'filter[company_name]'
          description: 'Filter records by company_name.'
          example: 'Kegos s.r.o.'
          required: true
          schema:
            type: string
            description: 'Filter records by company_name.'
            example: 'Kegos s.r.o.'
            nullable: false
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Wrong number of segments'
                properties:
                  message:
                    type: string
                    example: 'Wrong number of segments'
      tags:
        - Firmy
    post:
      summary: 'Vytvorenie novej firmy.'
      operationId: vytvorenieNovejFirmy
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Firmy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                  nullable: false
                company_city:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: amniihfqcoynlazghdtqt
                  nullable: false
                company_state:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: qxbajwbpilpmufinllwlo
                  nullable: false
                company_address:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: auydlsmsjuryvojcybzvr
                  nullable: false
                company_zip:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: byickznkygloigmkw
                  nullable: false
                company_ico:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: xphlvazjrcnfbaqywuxhg
                  nullable: true
                company_dic:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: jjmzuxjubqouzswiwxtrk
                  nullable: true
                company_ic_dph:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: imfcatbxspzmrazsroyjp
                  nullable: true
                company_bank_account:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: xmqesedyghenqcopwvown
                  nullable: true
                company_bank_swift:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: kbamlnfngefbeilfzsyux
                  nullable: true
              required:
                - company_name
                - company_city
                - company_state
                - company_address
                - company_zip
  /api/companies/residential:
    get:
      summary: 'Zoznam všetkých rezidencných firiem.'
      operationId: zoznamVetkchRezidencnchFiriem
      description: ''
      parameters:
        -
          in: query
          name: page
          description: 'Set the page number for pagination. Default: 1'
