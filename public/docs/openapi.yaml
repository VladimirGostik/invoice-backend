                  description: 'The <code>id</code> of an existing record in the companies table.'
                  example: null
                  nullable: true
                street_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the streets table.'
                  example: null
                  nullable: true
                invoice_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: mqeopfuudtdsufvyvddqa
                  nullable: false
                items:
                  type: array
                  description: 'Must have at least 1 items.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      description:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: 'Dolorum amet iste laborum eius est dolor.'
                        nullable: false
                      unit:
                        type: string
                        description: 'Must not be greater than 50 characters.'
                        example: dtdsufvyvddqamniihfqc
                        nullable: false
                      quantity:
                        type: integer
                        description: 'Must be at least 1.'
                        example: 51
                        nullable: false
                      unit_price:
                        type: number
                        description: 'Must be at least 0.'
                        example: 85
                        nullable: false
                      line_total:
                        type: number
                        description: 'Must be at least 0.'
                        example: 45
                        nullable: false
                    required:
                      - description
                      - unit
                      - quantity
                      - unit_price
                      - line_total
                subtotal:
