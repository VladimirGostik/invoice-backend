      -
        in: path
        name: id
        description: 'The ID of the company.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/companies/{company_id}/customization':
    put:
      summary: 'Aktualizácia interfacu firmy.'
      operationId: aktualizciaInterfacuFirmy
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Firmy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invoice_issuer_name:
                  type: string
                  description: 'Name of the invoice issuer'
                  example: 'John Doe'
                  nullable: false
                invoice_issuer_email:
                  type: string
                  description: 'Email of the invoice issuer'
                  example: john.doe@example.com
                  nullable: false
                invoice_issuer_phone:
                  type: string
                  description: 'Phone number of the invoice issuer'
                  example: '+123456789'
                  nullable: false
                signature_base64:
                  type: string
                  description: 'Base64 encoded signature image (PNG/JPG)'
                  example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
                  nullable: false
              required:
                - invoice_issuer_name
                - invoice_issuer_email
                - invoice_issuer_phone
                - signature_base64
    parameters:
      -
        in: path
        name: company_id
        description: 'The ID of the company.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: company
        description: ''
        example: 1
        required: true
        schema:
          type: 'ID of the company to update customization'
  /api/invoices/one-time:
    get:
      summary: 'Zoznam jednorazovych faktúr'
      operationId: zoznamJednorazovychFaktr
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Wrong number of segments'
                properties:
                  message:
                    type: string
                    example: 'Wrong number of segments'
      tags:
        - 'Jednorazové faktúry'
    post:
      summary: 'Vytvorenie novej faktúry.'
      operationId: vytvorenieNovejFaktry
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Jednorazové faktúry'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                  description: ''
                  example: 17
                  nullable: false
                residential_company_id:
                  type: integer
                  description: ''
                  example: 17
                  nullable: true
                street_id:
                  type: integer
                  description: ''
                  example: 17
                  nullable: true
                invoice_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: mqeopfuudtdsufvyvddqa
                  nullable: false
                items:
                  type: array
                  description: 'Must have at least 1 items.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      description:
                        type: string
                        description: 'Must not be greater than 255 characters.'
                        example: 'Dolorum amet iste laborum eius est dolor.'
                        nullable: false
                      unit:
                        type: string
                        description: 'Must not be greater than 50 characters.'
                        example: dtdsufvyvddqamniihfqc
                        nullable: false
                      quantity:
                        type: integer
                        description: 'Must be at least 1.'
                        example: 51
                        nullable: false
                      unit_price:
                        type: number
                        description: 'Must be at least 0.'
                        example: 85
                        nullable: false
                      line_total:
                        type: number
                        description: 'Must be at least 0.'
                        example: 45
                        nullable: false
                    required:
                      - description
                      - unit
                      - quantity
                      - unit_price
                      - line_total
                subtotal:
                  type: number
                  description: 'Must be at least 0.'
                  example: 73
                  nullable: false
                tax:
                  type: number
                  description: 'Must be at least 0.'
                  example: 45
                  nullable: false
                total:
                  type: number
                  description: 'Must be at least 0.'
                  example: 56
                  nullable: false
                issued_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2025-11-22T22:55:28'
                  nullable: false
                due_at:
                  type: string
                  description: 'Must be a valid date. Must be a date after or equal to <code>issued_at</code>.'
                  example: '2106-12-22'
                  nullable: false
                billing_year:
                  type: integer
                  description: 'Must be at least 2000. Must not be greater than 2100.'
                  example: 13
                  nullable: false
                billing_month:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 12.'
                  example: 8
                  nullable: false
                residential_company_name:
