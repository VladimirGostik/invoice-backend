        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email of the user.'
                  example: admin@example.com
                  nullable: false
              required:
                - email
      security: []
  /api/auth/reset-password:
    post:
      summary: 'Reset password'
      operationId: resetPassword
      description: "Reset user's password"
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  status: 'Status message'
                properties:
                  status:
                    type: string
                    example: 'Status message'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The password reset token.'
                  example: dd37ed6ef02e80ea8ced619f8bfbd5604568404a58b77cc0572575ccf0c8a159
                  nullable: false
                email:
                  type: string
                  description: 'The email of the user.'
                  example: qkunze@example.com
                  nullable: false
                password:
                  type: string
                  description: 'The new password.'
                  example: 'e@#L_EW>Vn'
                  nullable: false
                password_confirmation:
                  type: string
                  description: 'Confirm the new password.'
                  example: 'e@#L_EW>Vn'
                  nullable: false
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
