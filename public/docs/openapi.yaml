                    example: '2023-09-21T10 =>27 =>09.000000Z'
                  state:
                    type: string
                    example: ACTIVE
                  created_at:
                    type: string
                    example: '2023-09-21T10 =>27 =>09.000000Z'
                  updated_at:
                    type: string
                    example: '2023-09-21T10 =>27 =>09.000000Z'
