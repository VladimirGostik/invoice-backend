                  description: 'Must be at least 0.'
                  example: 73
                  nullable: false
                tax:
                  type: number
                  description: 'Must be at least 0.'
                  example: 45
                  nullable: false
                total:
                  type: number
                  description: 'Must be at least 0.'
                  example: 56
