          schema:
            type: integer
            description: 'Set the page number for pagination. Default: 1'
            example: 1
            nullable: false
        -
          in: query
          name: per_page
          description: 'Set the number of records per page. Default: 10'
          example: 10
          required: true
          schema:
            type: integer
            description: 'Set the number of records per page. Default: 10'
            example: 10
            nullable: false
        -
          in: query
          name: 'filter[company_name]'
          description: 'Filter records by company_name.'
          example: 'Kegos s.r.o.'
          required: true
          schema:
            type: string
            description: 'Filter records by company_name.'
            example: 'Kegos s.r.o.'
            nullable: false
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Wrong number of segments'
                properties:
                  message:
                    type: string
                    example: 'Wrong number of segments'
      tags:
        - Firmy
    post:
      summary: 'Vytvorenie novej rezidencnej firmy.'
      operationId: vytvorenieNovejRezidencnejFirmy
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Firmy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                  nullable: false
                company_city:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: amniihfqcoynlazghdtqt
                  nullable: false
                company_state:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: qxbajwbpilpmufinllwlo
                  nullable: false
                company_address:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: auydlsmsjuryvojcybzvr
                  nullable: false
                company_zip:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: byickznkygloigmkw
                  nullable: false
                company_ico:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: xphlvazjrcnfbaqywuxhg
                  nullable: true
                company_dic:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: jjmzuxjubqouzswiwxtrk
                  nullable: true
                company_ic_dph:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: imfcatbxspzmrazsroyjp
                  nullable: true
                company_bank_account:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: xmqesedyghenqcopwvown
                  nullable: true
                company_bank_swift:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: kbamlnfngefbeilfzsyux
                  nullable: true
              required:
                - company_name
                - company_city
                - company_state
                - company_address
                - company_zip
  '/api/companies/residential/{company_id}':
    get:
      summary: 'Zobrazenie rezidencnej firmy.'
      operationId: zobrazenieRezidencnejFirmy
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Wrong number of segments'
                properties:
                  message:
                    type: string
                    example: 'Wrong number of segments'
      tags:
        - Firmy
    parameters:
      -
        in: path
        name: company_id
        description: 'The ID of the company.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/companies/{id}':
    get:
      summary: 'Zobrazenie firmy.'
      operationId: zobrazenieFirmy
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Wrong number of segments'
                properties:
                  message:
                    type: string
                    example: 'Wrong number of segments'
      tags:
        - Firmy
    post:
      summary: 'Aktualizácia firmy.'
      operationId: aktualizciaFirmy
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Firmy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                  nullable: false
                company_city:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: amniihfqcoynlazghdtqt
                  nullable: false
                company_state:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: qxbajwbpilpmufinllwlo
                  nullable: false
                company_address:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: auydlsmsjuryvojcybzvr
                  nullable: false
                company_zip:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: byickznkygloigmkw
                  nullable: false
                company_ico:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: xphlvazjrcnfbaqywuxhg
                  nullable: false
                company_dic:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: jjmzuxjubqouzswiwxtrk
                  nullable: true
                company_ic_dph:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: imfcatbxspzmrazsroyjp
                  nullable: true
