                  created_at:
                    type: string
                    example: '2023-09-21T10 =>27 =>09.000000Z'
                  updated_at:
                    type: string
                    example: '2023-09-21T10 =>27 =>09.000000Z'
      tags:
        - Authentication
  /api/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Log the user out (Invalidate the token).'
      parameters: []
      responses: {  }
      tags:
